[project]
name = "doc-graph-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "certifi>=2026.4.22",
    "docx2python>=3.6.2",
    "easyocr>=1.7.2",
    "gmft>=0.4.3",
    "langchain-community>=0.4.1",
    "langchain-experimental>=0.4.1",
    "langchain-text-splitters>=1.1.2",
    "langdetect>=1.0.9",
    "neo4j>=6.1.0",
    "numpy>=2.4.4",
    "openai>=2.33.0",
    "opik>=2.0.37",
    "pdfplumber>=0.11.9",
    "pydantic>=2.13.3",
    "pyhwp>=0.1b15",
    "pymupdf>=1.27.2.3",
    "pymupdf4llm>=1.27.2.3",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.2",
    "python-mecab-ko>=1.3.7",
    "rouge-score>=0.1.2",
    "sentence-transformers>=5.4.1",
    "six>=1.17.0",
    "tenacity>=9.1.4",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.12",
]
